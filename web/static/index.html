<title>Microwants · XTools 数据前台</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f5f3; --surface: #ffffff; --surface-2: #f7f7f5; --border: #e4e3df; --border-strong: #cfcdc7;
  --text: #17171a; --text-2: #55554f; --muted: #8a8a83; --accent: #2a78d6; --accent-soft: #e8f1fc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --good: #0ca30c; --warn: #b87a00; --critical: #d03b3b; --critical-soft: #fbe9e9;
  --shadow: 0 8px 30px rgba(0,0,0,.12); --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1c1c1b; --surface-2: #232322; --border: #2f2f2d; --border-strong: #454541;
    --text: #f2f2ee; --text-2: #c3c2b7; --muted: #8d8d86; --accent: #3987e5; --accent-soft: #1d2a3b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --good: #3fbf3f; --warn: #e0a021; --critical: #e66767; --critical-soft: #3a2323;
    --shadow: 0 8px 30px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
button, select, input { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.bar { max-width: 1440px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 18px; height: 54px; }
.brand { font-weight: 600; font-size: 15px; white-space: nowrap; }
.brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
nav { display: flex; gap: 4px; }
nav a { padding: 6px 12px; border-radius: 8px; color: var(--text-2); font-weight: 500; }
nav a:hover { background: var(--surface-2); text-decoration: none; }
nav a.active { background: var(--accent-soft); color: var(--accent); }
.sync { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
.sync .dot.stale { background: var(--warn); }
main { max-width: 1440px; margin: 0 auto; padding: 18px 20px 60px; }
h1 { font-size: 20px; margin: 4px 0 14px; font-weight: 600; }
h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
h3 { font-size: 13px; margin: 18px 0 8px; color: var(--text-2); font-weight: 600; letter-spacing: .02em; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.grid { display: grid; gap: 14px; }
.grid > * { min-width: 0; }            /* 网格子项默认 min-width:auto，内容宽的卡片会撑破布局 */
.card { min-width: 0; overflow-x: auto; }   /* 列数多的表格在自己卡片内横向滚动，不会溢出去盖住旁边 */
.prod-name { max-width: 150px; min-width: 120px; white-space: normal; overflow-wrap: break-word; }  /* 约 SP-100-8-C4-NP 的 1.3 倍，再长折行 */
.group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 18px; }
/* 应收页顶部：左边窄账龄条，右边业务员小卡并排 */
.row-aging { grid-template-columns: minmax(230px, 290px) minmax(0, 1fr); align-items: start; }
.aging-list { display: grid; gap: 9px; }
/* 账龄严重度：实心三角 + 内嵌叹号，颜色分档（金黄 / 红 / 黑），黑三角的叹号反白 */
.tri { width: 17px; height: 17px; display: block; }
.tri .mark { stroke: #14140f; stroke-width: 2.6; stroke-linecap: round; }
.tri.t-gold { color: #f0b400; } .tri.t-red { color: #e03131; }
.tri.t-dark { color: var(--text); } .tri.t-dark .mark { stroke: var(--surface); }
.flame { font-size: 14px; line-height: 1; }
.aging-row { display: grid; grid-template-columns: 19px auto 1fr auto; gap: 4px 7px; align-items: center; position: relative; padding-bottom: 7px; }
.aging-row .ico { display: flex; justify-content: center; align-items: center; height: 17px; }
.aging-row b { text-align: right; font-variant-numeric: tabular-nums; }
.aging-row i { position: absolute; left: 0; bottom: 0; height: 3px; min-width: 2px; border-radius: 2px; background: var(--s1); opacity: .45; }
.who-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.who-cell { border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px 5px; background: var(--surface-2); line-height: 1.32; }
.who-cell.on { border-color: var(--accent); background: var(--accent-soft); }
.who-cell .top { display: flex; align-items: baseline; gap: 5px; }
.who-cell .top a { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.who-cell .top .muted { white-space: nowrap; }
.who-cell .top .ex { margin-left: auto; font-size: 11px; font-weight: 400; }
.who-cell .amt { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.2px; }
.who-cell .late { font-size: 11.5px; }
.who-cell .eye { color: var(--muted); display: inline-flex; align-items: center; cursor: pointer; }
.who-cell .eye:hover { color: var(--accent); }
.who-cell .eye svg { width: 13px; height: 13px; display: block; }
.who-cell .eye .eye-off { display: none; }
/* 折叠掉的业务员单独一行，方便截屏时裁掉 */
.who-hidden { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--border); }
.fold-chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); font-size: 12px; }
.fold-chip a[data-who-plans] { color: var(--text-2); }
.fold-chip .eye { color: var(--muted); display: inline-flex; cursor: pointer; }
.fold-chip .eye:hover { color: var(--accent); }
.fold-chip .eye svg { width: 12px; height: 12px; display: block; }
.fold-chip .eye .eye-open { display: none; } .fold-chip .eye .eye-off { display: block; }
.who-cell .mid { display: flex; align-items: flex-end; gap: 6px; }
.who-cell .mid .col { flex: 1 1 auto; min-width: 0; }
.sev { flex: 0 0 auto; display: grid; grid-template-columns: repeat(2, 14px); grid-auto-rows: 14px; gap: 2px; }
.sev i { display: flex; align-items: center; justify-content: center; }
.sev .tri { width: 13px; height: 13px; }
.flame.sm { font-size: 12px; }
@media (max-width: 1250px) { .who-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1000px) { .who-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.group-cell { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); }
.group-cell .inline-bar { margin-top: 4px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 14px; }
.kpi .label { color: var(--muted); font-size: 12px; }
.kpi .value { font-size: 24px; font-weight: 600; margin: 2px 0; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kpi .sub { color: var(--text-2); font-size: 12px; }
.kpi .sub b { font-weight: 500; }
.up { color: var(--good); } .down { color: var(--critical); }
.row2 { grid-template-columns: 2fr 1fr; align-items: start; }
.row3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 1100px) { .row2, .row3, .row-aging { grid-template-columns: 1fr; } }
.only-narrow { display: none; }
.btn.small { padding: 3px 9px; font-size: 12px; vertical-align: middle; margin-left: 8px; font-weight: 400; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filters input, .filters select { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 7px; padding: 6px 9px; min-width: 0; }
.filters input[type=text] { width: 220px; }
.filters input[type=date] { width: 140px; }
.filters .sep { color: var(--muted); }
.btn { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.link { border: none; background: none; color: var(--accent); padding: 4px 6px; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
.tabs a { padding: 8px 14px; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }
.tabs a:hover { text-decoration: none; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
td.num, th.num { text-align: right; white-space: nowrap; }
td.nowrap { white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.ellipsis { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.tag.open { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.tag.done { color: var(--good); background: transparent; }
.tag.bad { color: var(--critical); background: var(--critical-soft); border-color: transparent; }
.tag.warn { color: var(--warn); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pager { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 10px; color: var(--text-2); font-size: 13px; }
.summary { color: var(--text-2); font-size: 13px; margin: 0 0 8px; }
.summary b { color: var(--text); font-weight: 600; }
.inline-bar { position: relative; display: block; height: 18px; line-height: 18px; }
.inline-bar i { position: absolute; left: 0; top: 3px; height: 12px; background: var(--s1); opacity: .25; border-radius: 0 3px 3px 0; }
.inline-bar span { position: relative; padding-left: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.chip.active, .chip:hover { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart { width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .grid line { stroke: var(--border); }
.chart .axis line { stroke: var(--border-strong); }
.chart rect.vbar { rx: 2; }
.chart rect.hit { fill: transparent; }
.chart rect.hit:hover { fill: rgba(42,120,214,.06); }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); display: none; min-width: 160px; }
.tip b { font-weight: 600; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.error { color: var(--critical); padding: 12px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 30; display: none; }
.overlay.show { display: block; }
.drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(920px, 94vw); background: var(--surface); z-index: 40; box-shadow: var(--shadow); transform: translateX(105%); transition: transform .18s ease; display: flex; flex-direction: column; }
.drawer.show { transform: none; }
.drawer .head { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.drawer .head h2 { margin: 0; font-size: 16px; flex: 1; }
.title-alert { margin-left: 12px; padding: 2px 10px; border-radius: 999px; font-size: 15px; font-weight: 700; letter-spacing: .2px;
  color: var(--critical); background: var(--critical-soft); white-space: nowrap; }
.title-alert .sep2 { margin: 0 6px; opacity: .55; font-weight: 400; }
.title-due { margin-left: 12px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
.drawer .body { overflow: auto; padding: 14px 20px 40px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 18px; font-size: 13px; }
.kv div { display: flex; gap: 8px; min-width: 0; }
.kv label { color: var(--muted); white-space: nowrap; min-width: 64px; }
.kv span { word-break: break-all; }
.section-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.section-title .count { color: var(--muted); font-weight: 400; font-size: 12px; }
.money { font-variant-numeric: tabular-nums; }
.year-sel { margin-left: 8px; }
.top-list td:first-child { color: var(--muted); width: 22px; }
.mini { display: flex; align-items: flex-end; gap: 2px; height: 46px; }
.mini i { flex: 1; background: var(--s1); opacity: .7; border-radius: 2px 2px 0 0; min-width: 3px; }
.mini i.rec { background: var(--s2); }
.hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
pre.content { white-space: pre-wrap; margin: 4px 0 0; font: inherit; color: var(--text-2); }
.loading { opacity: .55; pointer-events: none; }
/* 0.5：分析页 */
.bar { flex-wrap: wrap; height: auto; min-height: 54px; padding-top: 4px; padding-bottom: 4px; }
nav { flex-wrap: wrap; }
.row4 { grid-template-columns: repeat(4, 1fr); }
.row22 { grid-template-columns: 1fr 1fr; align-items: start; }
@media (max-width: 1100px) { .row4, .row22 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 720px) { .row4, .row22 { grid-template-columns: 1fr; } }
.kpis.dense { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.kpis.dense .kpi .value { font-size: 20px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 10px; }
.crumb { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.crumb b { font-weight: 500; }
.crumb a { color: inherit; opacity: .7; font-weight: 600; }
.crumb a:hover { opacity: 1; text-decoration: none; }
.years label { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; font-size: 13px; cursor: pointer; }
.tier { display: inline-block; width: 22px; text-align: center; border-radius: 6px; font-weight: 600; font-size: 12px; padding: 1px 0; }
.tier.A { background: var(--accent); color: #fff; } .tier.B { background: var(--accent-soft); color: var(--accent); } .tier.C { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; color: var(--text-2); }
.note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
th.sortable { cursor: pointer; user-select: none; } th.sortable:hover { color: var(--text); }
.sort-arrow { margin-left: 3px; font-size: 10px; }
.sort-arrow.dim { opacity: .25; }
th.sortable:hover .sort-arrow.dim { opacity: .6; }
td.drill a { font-weight: 500; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.filter-more { display: none; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.toolbar .spacer { flex: 1; }
tr.total td { font-weight: 600; background: var(--surface-2); }
.mini.tall { height: 70px; }
.mini i.act { background: var(--s3); }
.mini i.neg { background: var(--critical); }

/* ------------------------------------------------------------------ 手机适配（0.6）
   窄屏下：导航横向滚动，网格与筛选栏单列，带表头的表格转成一行一张卡片（td 的 data-label 由 JS 按表头补上），
   抽屉全屏，图表压低并支持点按查看数值。断点 860px（平板竖屏）与 720px（手机）。 */
.narrow-only { display: none; }
@media (max-width: 860px) {
  .bar { padding: 0 12px; gap: 10px; }
  .brand { font-size: 14px; }
  .brand small { display: none; }
  nav { order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; padding: 0 0 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  nav::-webkit-scrollbar { display: none; }
  nav a { white-space: nowrap; padding: 6px 10px; flex: 0 0 auto; }
  .sync { margin-left: auto; max-width: 52vw; overflow: hidden; text-overflow: ellipsis; }
  .wide-only { display: none; }
  .narrow-only { display: inline; }
}
@media (max-width: 720px) {
  main { padding: 12px 12px 44px; padding-bottom: calc(44px + env(safe-area-inset-bottom)); }
  h1 { font-size: 18px; margin-bottom: 10px; }
  h1 .small, h1 .muted { display: block; font-size: 12px; margin-top: 2px; }
  .card { padding: 12px; border-radius: 12px; }
  .grid { gap: 10px; }
  .kpis, .kpis.dense { grid-template-columns: 1fr 1fr; }
  .kpi .value { font-size: 20px; }
  .kpi .sub { font-size: 11px; }
  .filters { gap: 6px; margin-bottom: 10px; }
  .filters input, .filters select { font-size: 16px; }          /* iOS 聚焦时不自动放大 */
  .filters input[type=text] { width: 100%; }
  .filters input[type=date] { flex: 1 1 42%; width: auto; }
  .filters select { flex: 1 1 45%; }
  .filters .sep { display: none; }
  .filters .btn { flex: 1 1 auto; padding: 8px 12px; }
  .filters:not(.open) input[type=text] { width: auto; flex: 1 1 120px; }       /* 折叠时与“筛选”“查询”同行 */
  .filters:not(.open) > .filter-more, .filters:not(.open) > #go { flex: 0 0 auto; }
  .filters label.small { flex: 1 1 100%; }
  .btn { padding: 8px 12px; }
  .tabs { overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { white-space: nowrap; }
  .chips { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; padding: 4px 12px; }
  .toolbar { gap: 6px; }
  .toolbar .spacer { display: none; }
  .years { display: flex; overflow-x: auto; scrollbar-width: none; }
  .years label { margin-right: 10px; }
  .pager { justify-content: space-between; }
  .pager .btn { flex: 0 0 auto; }
  .summary, .note, .hint { font-size: 12px; }
  .only-narrow { display: inline-block; }
  .who-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .who-cell { padding: 4px 7px 5px; }
  .who-cell .amt { font-size: 14px; }
  .who-cell .late { font-size: 11px; }
  .who-cell .mid { gap: 4px; }
  .sev { grid-template-columns: repeat(2, 12px); grid-auto-rows: 12px; }
  .sev .tri { width: 11px; height: 11px; }
  .flame.sm { font-size: 11px; }
  /* 带表头的表格 → 卡片 */
  table[data-cards] thead { display: none; }
  table[data-cards], table[data-cards] tbody, table[data-cards] td { display: block; width: auto; }
  table[data-cards] tbody tr { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; background: var(--surface-2); }
  table[data-cards] tbody td.lead { order: -1; }                               /* 卡片标题排到最上 */
  table[data-cards] tbody tr.total { background: var(--accent-soft); }
  table[data-cards] tbody tr.click:active { background: var(--accent-soft); }
  table[data-cards] tbody td { border: none; padding: 2px 0; display: flex; gap: 10px; align-items: baseline; text-align: left; white-space: normal; }
  table[data-cards] tbody td::before { content: attr(data-label); color: var(--muted); font-size: 12px; flex: 0 0 82px; }
  table[data-cards] tbody td > .cellwrap { flex: 1 1 auto; min-width: 0; }     /* 单元格里的多个块级元素仍各占一行 */
  table[data-cards] tbody td.num > .cellwrap { text-align: right; }
  table[data-cards] tbody td[data-blank] { display: none; }
  table[data-cards] tbody td.lead { margin-bottom: 2px; }
  table[data-cards] tbody td.lead > .cellwrap { font-weight: 600; font-size: 15px; }
  table[data-cards] tbody td.lead::before { display: none; }
  /* 筛选栏折叠：只留第一个控件与“查询”，点“筛选”展开 */
  .filter-more { display: inline-block; order: -1; }
  .filters:not(.open) > *:nth-child(n+3):not(#go) { display: none; }
  .filters:not(.open) > #go { order: 1; }
  table[data-cards] .ellipsis { max-width: none !important; white-space: normal; overflow: visible; }
  table[data-cards] tbody td > div.muted.small { margin-top: 0; }
  /* 无表头的两三列小表（Top 榜、按人员统计等）保持表格，只收紧留白并允许长词折行 */
  table:not([data-cards]) { table-layout: fixed; }
  table:not([data-cards]) th, table:not([data-cards]) td { padding: 6px 4px; overflow-wrap: anywhere; }
  table[data-cards] tbody td { overflow-wrap: anywhere; }
  .ellipsis { max-width: 60vw; }
  .kv { grid-template-columns: 1fr; }
  .kv label { min-width: 58px; }
  .drawer { width: 100vw; }
  .drawer .head { padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top)); }
  .drawer .head h2 { font-size: 15px; }
  .drawer .body { padding: 12px 12px 40px; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  h3 { margin: 14px 0 6px; }
  .tip { max-width: 78vw; }
}
@media (max-width: 360px) {
  .kpis, .kpis.dense { grid-template-columns: 1fr; }
  table[data-cards] tbody td::before { flex-basis: 74px; }
}
</style>

  <div class="head"><button class="btn link" id="drawerBack" style="display:none">‹ 返回</button><h2 id="drawerTitle"></h2><button class="btn" id="drawerClose">关闭</button></div>
  <div class="body" id="drawerBody"></div>

<script>
'use strict';
// ------------------------------------------------------------------ 工具
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney = (v) => { const n = Number(v || 0); return (Math.abs(n) >= 1e6 ? Math.round(n) : Math.round(n * 100) / 100).toLocaleString('zh-CN', { maximumFractionDigits: 2 }); };
const fmtWan = (v) => { const n = Number(v || 0); if (Math.abs(n) >= 1e8) return (n / 1e8).toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + ' 亿'; return (n / 1e4).toLocaleString('zh-CN', { maximumFractionDigits: 1 }) + ' 万'; };
const fmtInt = (v) => Number(v || 0).toLocaleString('zh-CN');
const pct = (a, b) => (!b ? '—' : ((a - b) / Math.abs(b) * 100).toFixed(1) + '%');
const today = () => new Date().toISOString().slice(0, 10);
const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
const yearStart = () => today().slice(0, 4) + '-01-01';
let META = null;

async function api(path, params) {
  const url = new URL(path, location.origin);
  Object.entries(params || {}).forEach(([k, v]) => { if (v !== '' && v != null) url.searchParams.set(k, v); });
  const r = await fetch(url);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function statusTag(o) {
  const cls = o.status === '1' ? 'open' : o.status === '2' ? 'done' : o.status === '3' ? 'bad' : '';
  return `<span class="tag ${cls}">${esc(o.status_text || o.status || '')}</span>`;
}
function planTag(p) {
  if (p.status === '1') return '<span class="tag done">已回</span>';
  if (p.overdue_days > 0) return `<span class="tag bad">逾期 ${p.overdue_days} 天</span>`;
  return `<span class="tag ${p.status === '4' ? 'warn' : 'open'}">${esc(p.status_text)}</span>`;
}
// 订单 / 客户抽屉标题右侧的回款提示：有逾期用红色醒目标签，否则只标未回金额
function planAlert(plans) {
  const open = (plans || []).filter((p) => p.status !== '1');
  const late = open.filter((p) => p.overdue_days > 0);
  if (late.length) {
    const amount = late.reduce((s, p) => s + (p.amount || 0), 0), days = Math.max(...late.map((p) => p.overdue_days));
    return `<span class="title-alert" title="${late.length} 期逾期未回，最久 ${days} 天">逾期 ${fmtMoney(amount)}<span class="sep2">·</span>${days} 天${late.length > 1 ? `<span class="sep2">·</span>${late.length} 期` : ''}</span>`;
  }
  if (open.length) return `<span class="title-due" title="${open.length} 期未到期">未回 ${fmtMoney(open.reduce((s, p) => s + (p.amount || 0), 0))}</span>`;
  return '';
}
const actionText = (a) => `${a.subject ? `<div><b style="font-weight:500">${esc(a.subject)}</b></div>` : ''}${a.content ? `<pre class="content">${esc(a.content)}</pre>` : ''}`;
const mentions = (a) => a.mentions && a.mentions.length ? `<div class="muted small">提及 ${esc(a.mentions.join('、'))}</div>` : '';
const dateFlag = (f) => f === 'future' ? '<div><span class="tag bad" title="CRM 中录入的日期晚于今天（如把 2024 写成 2224），请在 CRM 里更正；镜像每周全量重拉后会更新">日期异常</span></div>' : f === 'invalid' ? '<div><span class="tag" title="CRM 中该记录没有日期">无日期</span></div>' : '';
const custLink = (c) => c ? (c.id ? `<a data-cust="${c.id}">${esc(c.name)}</a>` : esc(c.name)) : '<span class="muted">—</span>';
const orderLink = (id, no) => id ? `<a data-order="${id}">${esc(no || id)}</a>` : esc(no || '');
function options(list, valueKey, textKey, current, blank) {
  return `<option value="">${esc(blank)}</option>` + list.map((x) => `<option value="${esc(x[valueKey])}" ${String(x[valueKey]) === String(current ?? '') ? 'selected' : ''}>${esc(x[textKey])}</option>`).join('');
}
function userOptions(current, blank) { return options(META.users.filter((u) => u.active || String(u.part) === String(current)), 'part', 'name', current, blank); }
function dictOptions(name, current, blank) { return options(META.dicts[name] || [], 'key', 'value', current, blank); }
function pager(res, onPage) {
  const pages = Math.max(1, Math.ceil(res.total / res.size));
  const el = document.createElement('div');
  el.className = 'pager';
  el.innerHTML = `<span>共 ${fmtInt(res.total)} 条 · 第 ${res.page} / ${pages} 页</span>
    <button class="btn" ${res.page <= 1 ? 'disabled' : ''} data-p="${res.page - 1}">上一页</button>
    <button class="btn" ${res.page >= pages ? 'disabled' : ''} data-p="${res.page + 1}">下一页</button>`;
  el.querySelectorAll('button[data-p]').forEach((b) => b.addEventListener('click', () => onPage(Number(b.dataset.p))));
  return el;
}
function inlineBar(value, max, text) {
  const w = max ? Math.max(0, Math.min(100, value / max * 100)) : 0;
  return `<span class="inline-bar"><i style="width:${w}%"></i><span>${text}</span></span>`;
}
// 窄屏下表格改为一行一卡（样式见 @media），这里按 thead 给每个单元格补上标签；无表头的小表保持原样。
function decorateTables(root) {
  root.querySelectorAll('table:not([data-scanned])').forEach((t) => {
    t.setAttribute('data-scanned', '');
    const heads = [...t.querySelectorAll('thead th')].map((th) => th.textContent.replace(/[\u2195\u25b2\u25bc]/g, '').replace(/\s+/g, ' ').trim());
    if (heads.length < 5) return;                                      // 三四列的小汇总表在窄屏仍以表格更好读
    t.setAttribute('data-cards', '');
    t.querySelectorAll('tbody > tr').forEach((tr) => {
      const tds = [...tr.children];
      if (tds.length === 1 && tds[0].hasAttribute('colspan')) return;   // “没有符合条件的记录”整行
      let lead = tds.findIndex((td) => td.classList.contains('lead'));  // 模板标了卡片标题就用它
      tds.forEach((td, i) => {
        const text = td.textContent.trim();
        if (heads[i]) td.setAttribute('data-label', heads[i]);
        if (!text || text === '—') td.setAttribute('data-blank', '');
        else if (lead < 0 && text.length > 2) lead = i;
        if (td.children.length > 1 && !td.querySelector(':scope > .cellwrap')) {  // 一格里有多块内容时包一层，卡片里才会竖着排
          const box = document.createElement('div');
          box.className = 'cellwrap';
          while (td.firstChild) box.appendChild(td.firstChild);
          td.appendChild(box);
        }
      });
      if (lead >= 0) tds[lead].classList.add('lead');
    });
  });
}
// 窄屏下筛选栏折叠：插入“筛选”按钮，展开前只显示第一个控件与“查询”
function decorateFilters(root) {
  root.querySelectorAll('.filters:not([data-mob])').forEach((f) => {
    f.setAttribute('data-mob', '');
    if (f.querySelectorAll('input:not([type=hidden]), select').length < 3) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn filter-more';
    btn.textContent = '筛选 ▾';
    btn.addEventListener('click', () => { btn.textContent = f.classList.toggle('open') ? '收起 ▴' : '筛选 ▾'; });
    f.insertBefore(btn, f.firstChild);
  });
}
let scanQueued = false;
new MutationObserver(() => {
  if (scanQueued) return;
  scanQueued = true;
  requestAnimationFrame(() => { scanQueued = false; decorateTables(document); decorateFilters(document); });
}).observe(document.body, { childList: true, subtree: true });

function bindLinks(root) {
  root.querySelectorAll('a[data-cust]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); openCustomer(Number(a.dataset.cust)); }));
  root.querySelectorAll('a[data-order]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); openOrder(Number(a.dataset.order)); }));
  root.querySelectorAll('a[data-prod]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); openProduct(a.dataset.prod); }));

// ------------------------------------------------------------------ 图表（SVG）
const tip = $('#tip');
function showTip(html, x, y) { tip.innerHTML = html; tip.style.display = 'block'; const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.min(x + 14, innerWidth - w - 10) + 'px'; tip.style.top = Math.max(8, Math.min(y + 14, innerHeight - h - 10)) + 'px'; }
function hideTip() { tip.style.display = 'none'; }
let tipTouched = 0;
document.addEventListener('touchstart', (e) => { if (!(e.target instanceof Element) || !e.target.closest('rect.hit')) hideTip(); }, { passive: true });
addEventListener('scroll', () => { if (tip.style.display === 'block' && Date.now() - tipTouched > 400) hideTip(); }, { passive: true });

// 轴标签的短格式（窄屏用，避免 y 轴占掉半屏）
const fmtAxis = (v) => { const n = Number(v || 0); if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(1) + '亿'; if (Math.abs(n) >= 1e4) return Math.round(n / 1e4) + '万'; return String(Math.round(n)); };
// 分组柱图：labels[], series[{name,color,values[]}], tipFn(i) → html
function barChart(el, { labels, series, tipFn, height = 330, format = fmtWan }) {
  const W = Math.max(el.clientWidth || 800, 300);
  const narrow = W < 520;                                    // 手机：压低高度、收窄留白、少画 x 标签
  const H = narrow ? Math.min(height, 235) : height;
  const padL = narrow ? 40 : 58, padR = narrow ? 6 : 10, padT = 12, padB = narrow ? 24 : 28;
  if (narrow) format = fmtAxis;
  const max = Math.max(1, ...series.flatMap((s) => s.values));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const iw = W - padL - padR, ih = H - padT - padB;
  const gw = iw / labels.length, bw = Math.max(3, (gw * 0.7) / series.length - 2);
  const y = (v) => padT + ih - (v / top) * ih;
  let g = `<g class="grid">`;
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${format(v)}</text>`;
  g += `</g><g class="axis"><line x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/></g>`;
  let bars = '', hits = '', xs = '';
  labels.forEach((lab, i) => {
    const x0 = padL + i * gw + (gw - (bw + 2) * series.length) / 2;
    series.forEach((s, k) => {
      const v = s.values[i] || 0, h = Math.max(0, y(0) - y(v));
      bars += `<rect class="vbar" x="${x0 + k * (bw + 2)}" y="${y(v)}" width="${bw}" height="${h}" fill="${s.color}"/>`;
    });
    hits += `<rect class="hit" data-i="${i}" x="${padL + i * gw}" y="${padT}" width="${gw}" height="${ih}"/>`;
    if (labels.length <= (narrow ? 7 : 16) || i % Math.ceil(labels.length / (narrow ? 6 : 12)) === 0) xs += `<text x="${padL + i * gw + gw / 2}" y="${H - 8}" text-anchor="middle">${esc(lab)}</text>`;
  });
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}${bars}${xs}${hits}</svg>`;
  el.querySelectorAll('rect.hit').forEach((r) => {
    // 触摸后浏览器会补发一串鼠标事件（最后是 mouseleave），600 毫秒内忽略，否则刚点出来的数值立刻被关掉
    r.addEventListener('mousemove', (e) => { if (Date.now() - tipTouched > 600) showTip(tipFn(Number(r.dataset.i)), e.clientX, e.clientY); });
    r.addEventListener('mouseleave', () => { if (Date.now() - tipTouched > 600) hideTip(); });
    r.addEventListener('touchstart', (e) => {
      const t = e.touches[0] || e.changedTouches[0];
      tipTouched = Date.now();
      if (t) showTip(tipFn(Number(r.dataset.i)), t.clientX, t.clientY);
    }, { passive: true });
  });
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function miniBars(values, cls, titles) {
  const max = Math.max(1, ...values);
  return `<div class="mini">${values.map((v, i) => `<i class="${cls || ''}" style="height:${Math.max(2, v / max * 100)}%" title="${esc(titles ? titles[i] : v)}"></i>`).join('')}</div>`;
}

  };

    setHash('sales', current());

      const d = await api('/api/sales', current());

      $('#legend').innerHTML = years.map((y, i) => `<span><i style="background:${SERIES[i]}"></i>${y}</span>`).join('') + (d.line_mode ? '<span class="muted">明细金额</span>' : '');
      $('#chartNote').textContent = d.ytd ? `各年 1 月 1 日至 ${META.today.slice(5)}` : '';

      // 明细表
      const max = Math.max(1, ...d.rows.map((r) => (r.cells[latest] || {}).amount || 0));
      const drill = { who: 'customer', customer: 'product', product: 'customer', class: 'product', group: 'class', region: 'customer', type: 'who', month: 'who' };
      const dimName = Object.fromEntries(SALES_DIMS);
      table.innerHTML = `<table><thead><tr><th>#</th><th>${dimName[d.by]}</th>${years.map((y) => `<th class="num">${y}${d.line_mode ? ' 金额 / 数量' : ''}</th>`).join('')}<th class="num">同比</th><th class="num">合计</th><th></th></tr></thead><tbody>
        <tr class="total"><td></td><td>合计</td>${years.map((y) => `<td class="num">${fmtMoney((d.totals[y] || {}).amount)}<div class="muted small">${fmtInt((d.totals[y] || {}).count)} 单${d.line_mode ? ` · ${fmtInt((d.totals[y] || {}).qty)}` : ''}</div></td>`).join('')}<td class="num">${years.length > 1 ? yoyText((d.totals[latest] || {}).amount, (d.totals[years[1]] || {}).amount) : '—'}</td><td class="num">${fmtMoney(years.reduce((s, y) => s + ((d.totals[y] || {}).amount || 0), 0))}</td><td></td></tr>
        ${d.rows.map((r, i) => {
          const name = d.by === 'customer' ? custLink(r.customer) : d.by === 'product' ? prodLink({ model_name: r.model_name, name: r.name }) : d.by === 'who' ? whoLink(r.name) : esc(r.name);
          const drillable = !(d.by === 'customer' && !r.id);
          return `<tr><td class="muted">${i + 1}</td><td class="drill lead">${name}${r.sub ? `<div class="muted small">${esc(r.sub)}</div>` : ''}</td>
            ${years.map((y, k) => { const c = r.cells[y] || { amount: 0, count: 0, qty: 0 }; return `<td class="num">${k === 0 ? inlineBar(c.amount, max, fmtMoney(c.amount)) : fmtMoney(c.amount)}<div class="muted small">${c.count ? `${fmtInt(c.count)} 单` : '—'}${d.line_mode && c.qty ? ` · ${fmtInt(c.qty)}` : ''}</div></td>`; }).join('')}
            <td class="num">${r.yoy == null ? '<span class="muted">—</span>' : `<span class="${r.yoy >= 0 ? 'up' : 'down'}">${r.yoy > 0 ? '+' : ''}${r.yoy}%</span>`}</td><td class="num">${fmtMoney(r.total)}</td>
            <td class="nowrap small">${drillable && drill[d.by] ? `<a data-drill="${i}">下钻 ${dimName[drill[d.by]]}</a> · ` : ''}<a data-orders="${i}">订单</a></td></tr>`; }).join('') || `<tr><td colspan="${years.length + 5}" class="empty">没有数据</td></tr>`}
      </tbody></table>`;
      const filterFor = (r) => ({ who: { who: r.key }, customer: { customer_id: r.id }, product: { prod: r.model_name }, class: { class: r.key }, group: { group: r.key }, region: { state: r.key }, type: { type: r.key }, month: { month: `${latest}-${r.key}` } }[d.by]);
      table.querySelectorAll('a[data-drill]').forEach((a) => a.addEventListener('click', () => { const r = d.rows[Number(a.dataset.drill)]; Object.assign(state, filterFor(r)); state.by = drill[d.by]; view.querySelectorAll('#dims .chip').forEach((c) => c.classList.toggle('active', c.dataset.by === state.by)); load(); }));
      table.querySelectorAll('a[data-orders]').forEach((a) => a.addEventListener('click', () => { const r = d.rows[Number(a.dataset.orders)]; const q = { who: state.who, customer_id: state.customer_id, prod: state.prod, class: state.class, group: state.group, state: state.state, type: state.type, owner: state.owner, month: state.month, ...filterFor(r) };
        if (!q.month) { q.from = `${latest}-01-01`; q.to = d.ytd ? `${latest}-${META.today.slice(5)}` : `${latest}-12-31`; } go('orders', q); }));
      bindLinks(table);
    } catch (e) { table.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
    table.classList.remove('loading');
  };
  view.querySelectorAll('#dims .chip').forEach((c) => c.addEventListener('click', () => { state.by = c.dataset.by; view.querySelectorAll('#dims .chip').forEach((x) => x.classList.toggle('active', x === c)); load(); }));
  $('#years').addEventListener('change', () => { const ys = [...view.querySelectorAll('#years input:checked')].map((i) => i.value); if (!ys.length) return; state.years = ys.join(','); load(); });
  $('#ytd').addEventListener('change', (e) => { state.ytd = e.target.checked ? '1' : ''; load(); });
  $('#limit').addEventListener('change', (e) => { state.limit = e.target.value; load(); });
  bindExport(view, current);
  load();
}

// 计量单位：CRM 未填时按色谱填料默认公斤，显示上标注出来（产品编号里的 20kg/桶 是包装规格，不是单位）
const unitTag = (p) => p.unit ? ` <span class="muted small"${p.unit_assumed ? ' title="CRM 未填计量单位，色谱填料按公斤计"' : ''}>${esc(p.unit)}${p.unit_assumed ? '*' : ''}</span>` : '';

const triIcon = (cls, title) => `<svg class="tri ${cls}" viewBox="0 0 24 24" aria-hidden="false"><title>${title}</title>`
  + `<path d="M11.13 2.6a1 1 0 0 1 1.74 0l10.1 17.9A1 1 0 0 1 22.1 22H1.9a1 1 0 0 1-.87-1.5L11.13 2.6Z" fill="currentColor"/>`
  + `<path class="mark" d="M12 9v5" fill="none"/><path class="mark" d="M12 17.6h.01" fill="none"/></svg>`;

// 业务员卡上的小眼睛：折叠 / 展开这一格，隐藏名单只记在本机浏览器，不影响统计与导出
const EYE_SVG = `<svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.6 12S5.7 5 12 5s10.4 7 10.4 7-4.1 7-10.4 7S1.6 12 1.6 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>`
  + `<svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2.4 8.6C5 12.6 8.3 15 12 15s7-2.4 9.6-6.4"/><path d="M4.3 13.7 2.4 16.6M9 15.7l-.8 3.1M15 15.7l.8 3.1M19.7 13.7l1.9 2.9"/></svg>`;
const HIDDEN_WHO_KEY = 'xtools.hiddenWho';
const readHiddenWho = () => { try { return new Set(JSON.parse(localStorage.getItem(HIDDEN_WHO_KEY) || '[]')); } catch (e) { return new Set(); } };
const writeHiddenWho = (set) => { try { localStorage.setItem(HIDDEN_WHO_KEY, JSON.stringify([...set])); } catch (e) { /* 隐私模式下忽略 */ } };

// 业务员卡右下角的四宫格：四个账龄档各占一格，有欠款才显示图标（位置固定，便于横向比较）
const SEV_CELLS = [['d30', 't-gold', '逾期 ≤30 天'], ['d90', 't-red', '逾期 31–90 天'], ['d365', 't-dark', '逾期 91–365 天'], ['d365p', 'flame', '逾期超过 1 年']];
const sevGrid = (aging) => {
  const a = aging || {};
  if (!SEV_CELLS.some(([k]) => a[k] > 0)) return '';
  return `<div class="sev">${SEV_CELLS.map(([k, cls, label]) => !(a[k] > 0) ? '<i></i>'
    : cls === 'flame' ? `<i title="${label} ${fmtMoney(a[k])}"><span class="flame sm">🔥</span></i>`
    : `<i>${triIcon(cls, `${label} ${fmtMoney(a[k])}`)}</i>`).join('')}</div>`;
};

  $('[name=group]').addEventListener('change', (e) => { $('#classSel').innerHTML = classOptions(e.target.value, ''); });
  const setSort = (key) => {                                     // 点表头：同一列切升降序，换列从大到小
    const cur = $('[name=sort]').value, dir = $('[name=dir]').value;
    $('[name=sort]').value = key;
    $('[name=dir]').value = cur === key && dir !== 'asc' ? 'asc' : cur === key ? 'desc' : (key === 'name' || key === 'sn' ? 'asc' : 'desc');
  };
  const load = async (page) => {
    const q = { ...readFilters($('#filters')), page };
    setHash('products', q);
    const list = $('#list');
    list.classList.add('loading');
    try {
      const res = await api('/api/products', { ...q, size: 50 });
      const byModel = res.view === 'model';
      const s = res.summary;
      const unit = byModel ? '个型号' : '个产品';
      $('#kpis').innerHTML = kpiCard(`${byModel ? '型号' : '产品'}（按当前筛选）`, fmtInt(res.total), `有库存 ${fmtInt(s.with_stock)}`)

        + kpiCard('滞销', fmtInt(s.unsold), `有库存、${res.window}无销售`)
        + kpiCard(`${res.window}销售额`, fmtWan(s.amount), `${fmtInt(s.sold)} ${unit}有销售 · 数量 ${fmtInt(s.qty)}`);
      const gmax = Math.max(1, ...res.by_group.map((g) => g.amount));
      $('#byGroup').innerHTML = `<h2>按大类 <span class="count">${res.window}</span></h2><div class="group-grid">${res.by_group.map((g) => `<div class="group-cell"><a data-group="${esc(g.group)}">${esc(g.group)}</a><div class="muted small">${fmtInt(g.products)} ${unit} · 有库存 ${fmtInt(g.with_stock)}</div>${inlineBar(g.amount, gmax, fmtMoney(g.amount))}</div>`).join('') || '<div class="empty">无</div>'}</div><p class="note">分类树来自 CRM 产品类别；产品表里只存分类标题，按标题归到大类。</p>`;
      $('#byGroup').querySelectorAll('a[data-group]').forEach((a) => a.addEventListener('click', () => { $('[name=group]').value = a.dataset.group; $('#classSel').innerHTML = classOptions(a.dataset.group, ''); load(1); }));
      $('#sortUi').innerHTML = sortOptions(byModel).map(([k, label, d, a]) =>
        `<option value="${k}:desc" ${res.sort === k && res.dir !== 'asc' ? 'selected' : ''}>${label} ${d}</option><option value="${k}:asc" ${res.sort === k && res.dir === 'asc' ? 'selected' : ''}>${label} ${a}</option>`).join('');
      const max = Math.max(1, ...res.rows.map((r) => r.sales_amount));
      const arrow = (key) => res.sort === key ? `<span class="sort-arrow">${res.dir === 'asc' ? '▲' : '▼'}</span>` : '<span class="sort-arrow dim">↕</span>';
      const th = (key, label, cls) => `<th class="${cls ? cls + ' ' : ''}sortable" data-sort="${key}">${label}${arrow(key)}</th>`;
      const head = byModel
        ? `<tr>${th('name', '型号', '')}${th('batches', '批号', 'num')}<th>分类</th>${th('price', '价格', 'num')}${th('stock', '库存合计', 'num')}${th('amount', res.window + '销售额', 'num')}${th('qty', '数量', 'num')}${th('orders', '单数', 'num')}${th('customers', '客户', 'num')}${th('last', '最近销售', '')}</tr>`
        : `<tr>${th('sn', '编号', '')}${th('name', '产品', '')}<th>分类</th>${th('price', '价格', 'num')}${th('stock', '库存', 'num')}${th('amount', res.window + '销售额', 'num')}${th('qty', '数量', 'num')}${th('orders', '单数', 'num')}${th('customers', '客户', 'num')}${th('last', '最近销售', '')}</tr>`;
      const body = byModel
        ? res.rows.map((p) => `<tr class="click" data-prod="model:${esc(p.model_name)}"><td class="lead"><div class="prod-name" title="${esc(p.model_name)}">${esc(p.model_name)}</div></td>
            <td class="num">${fmtInt(p.batches)}<div class="muted small">${!p.batches_in_stock ? '无货' : p.batches_in_stock === p.batches ? '全有货' : `${fmtInt(p.batches_in_stock)} 个有货`}</div></td>
            <td class="small">${esc(p.class)}<div class="muted">${esc(p.group)}</div></td><td class="num">${p.price ? fmtMoney(p.price) : '<span class="muted">—</span>'}</td>
            <td class="num">${fmtInt(p.stock)}${unitTag(p)}${p.units > 1 ? ' <span class="tag warn" title="该型号下有库存的批号之间计量单位不一致，合计仅供参考">单位不一</span>' : ''}${p.low_batches ? ` <span class="tag bad" title="${p.low_batches} 个批号低于下限">低</span>` : ''}</td>
            <td class="num">${inlineBar(p.sales_amount, max, fmtMoney(p.sales_amount))}</td><td class="num">${fmtInt(p.sales_qty)}</td><td class="num">${p.sales_orders}</td><td class="num">${p.sales_customers}</td><td class="nowrap small">${esc(p.last_sale || '—')}</td></tr>`).join('')
        : res.rows.map((p) => `<tr class="click" data-prod="${p.id}"><td class="nowrap small">${esc(p.sn || '（无编号）')}</td><td class="lead"><div class="prod-name" title="${esc(p.name)}">${esc(p.name)}</div><div class="muted small">${esc([p.pack, p.model].filter((x) => x && x !== '-').join(' · '))}${p.status && p.status !== '正常' ? ` · <span class="tag warn">${esc(p.status)}</span>` : ''}</div></td>
            <td class="small">${esc(p.class)}<div class="muted">${esc(p.group)}</div></td><td class="num">${p.price ? fmtMoney(p.price) : '<span class="muted">—</span>'}</td><td class="num">${fmtInt(p.stock)}${unitTag(p)}${p.stock_low ? ` <span class="tag bad" title="下限 ${p.ldown}">低</span>` : ''}</td>
            <td class="num">${inlineBar(p.sales_amount, max, fmtMoney(p.sales_amount))}</td><td class="num">${fmtInt(p.sales_qty)}</td><td class="num">${p.sales_orders}</td><td class="num">${p.sales_customers}</td><td class="nowrap small">${esc(p.last_sale || '—')}</td></tr>`).join('');
      list.innerHTML = `<p class="summary">共 <b>${fmtInt(res.total)}</b> ${unit}${byModel ? '（同一产品名下的批号已合并；点开看各批号库存）' : ''}</p>
        <table><thead>${head}</thead><tbody>${body || `<tr><td colspan="10" class="empty">没有符合条件的${byModel ? '型号' : '产品'}</td></tr>`}</tbody></table>`;
      list.appendChild(pager(res, load));
      list.querySelectorAll('tr[data-prod]').forEach((tr) => tr.addEventListener('click', () => openProduct(tr.dataset.prod)));
      list.querySelectorAll('th.sortable').forEach((el) => el.addEventListener('click', () => { setSort(el.dataset.sort); load(1); }));
    } catch (e) { list.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
    list.classList.remove('loading');
  };
  $('#sortUi').addEventListener('change', (e) => {
    const [key, dir] = e.target.value.split(':');
    $('[name=sort]').value = key; $('[name=dir]').value = dir; load(1);
  });
  view.querySelectorAll('#views .chip').forEach((c) => c.addEventListener('click', () => {
    view.querySelectorAll('#views .chip').forEach((x) => x.classList.toggle('active', x === c));
    $('[name=view]').value = c.dataset.view;
    if ($('[name=sort]').value === 'sn' || $('[name=sort]').value === 'batches') { $('[name=sort]').value = 'amount'; $('[name=dir]').value = 'desc'; }
    load(1);
  }));
  wireFilters(view, load, { months: '12', view: 'batch', sort: 'amount', dir: 'desc' });
  bindExport(view, () => readFilters($('#filters')));
  load(Number(f.page) || 1);
}

async function tabCashflow(body, params) {
  const f = { months: '24', ...params };
  body.innerHTML = `<div class="filters" id="filters"><select name="months">${['12', '24', '36', '60'].map((m) => `<option value="${m}" ${f.months === m ? 'selected' : ''}>近 ${m} 个月</option>`).join('')}</select><span class="muted small">销售侧：订单额、回款记录；采购侧：采购单额、已付 / 未付付款计划（按计划日期）。均折算人民币。</span></div>
    <div class="grid row22"><div class="card"><h2>订单额 vs 采购额</h2><div class="legend"><span><i style="background:var(--s1)"></i>订单额</span><span><i style="background:var(--s3)"></i>采购额</span></div><div id="c1"></div></div>
      <div class="card"><h2>回款 vs 付款</h2><div class="legend"><span><i style="background:var(--s2)"></i>回款</span><span><i style="background:#8e5bd6"></i>已付</span><span><i style="background:#c9a227"></i>未付计划</span></div><div id="c2"></div></div></div>
    <div class="grid kpis dense" style="margin-top:14px" id="kpis"></div>
    <div class="card" id="table"><div class="empty">加载中…</div></div>`;
  const load = async () => {
    const q = { ...readFilters($('#filters')), tab: 'cashflow' };
    setHash('purchases', q);
    try {
      const d = await api('/api/cashflow', q);
      const labels = d.rows.map((r) => r.month.slice(2));
      barChart($('#c1'), { labels, height: 220, series: [{ name: '订单额', color: 'var(--s1)', values: d.rows.map((r) => r.sales) }, { name: '采购额', color: 'var(--s3)', values: d.rows.map((r) => r.purchases) }], tipFn: (i) => `<b>${d.rows[i].month}</b><br>订单 ${fmtMoney(d.rows[i].sales)}（${d.rows[i].orders} 单）<br>采购 ${fmtMoney(d.rows[i].purchases)}（${d.rows[i].purchase_orders} 单）` });
      barChart($('#c2'), { labels, height: 220, series: [{ name: '回款', color: 'var(--s2)', values: d.rows.map((r) => r.receipts) }, { name: '已付', color: '#8e5bd6', values: d.rows.map((r) => r.paid) }, { name: '未付', color: '#c9a227', values: d.rows.map((r) => r.open) }], tipFn: (i) => `<b>${d.rows[i].month}</b><br>回款 ${fmtMoney(d.rows[i].receipts)}<br>已付 ${fmtMoney(d.rows[i].paid)}<br>未付计划 ${fmtMoney(d.rows[i].open)}` });
      const t = d.totals;
      $('#kpis').innerHTML = kpiCard(`近 ${d.months} 个月订单额`, fmtWan(t.sales), `采购额 ${fmtWan(t.purchases)}`) + kpiCard('回款', fmtWan(t.receipts), `已付 ${fmtWan(t.paid)} · 净流入 ${fmtWan(t.receipts - t.paid)}`) + kpiCard('未回款计划（应收）', fmtWan(d.open_receivables.amount), `${fmtInt(d.open_receivables.count)} 期`) + kpiCard('未付付款计划（应付）', fmtWan(d.open_payments.rmb), `${fmtInt(d.open_payments.count)} 期 · 未来 12 个月内 ${fmtWan(d.upcoming.reduce((s, u) => s + u.rmb, 0))}`);
      $('#table').innerHTML = `<table><thead><tr><th>月份</th><th class="num">订单额</th><th class="num">单数</th><th class="num">采购额</th><th class="num">采购单</th><th class="num">回款</th><th class="num">已付</th><th class="num">未付计划</th><th class="num">回款 − 已付</th></tr></thead><tbody>
        ${d.rows.slice().reverse().map((r) => `<tr><td class="nowrap lead">${r.month}</td><td class="num">${fmtMoney(r.sales)}</td><td class="num">${r.orders}</td><td class="num">${fmtMoney(r.purchases)}</td><td class="num">${r.purchase_orders}</td><td class="num">${fmtMoney(r.receipts)}</td><td class="num">${fmtMoney(r.paid)}</td><td class="num">${r.open ? fmtMoney(r.open) : '<span class="muted">—</span>'}</td><td class="num ${r.receipts - r.paid >= 0 ? 'up' : 'down'}">${fmtMoney(r.receipts - r.paid)}</td></tr>`).join('')}
        <tr class="total"><td>合计</td><td class="num">${fmtMoney(t.sales)}</td><td></td><td class="num">${fmtMoney(t.purchases)}</td><td></td><td class="num">${fmtMoney(t.receipts)}</td><td class="num">${fmtMoney(t.paid)}</td><td class="num">${fmtMoney(t.open)}</td><td class="num">${fmtMoney(t.receipts - t.paid)}</td></tr>
      </tbody></table><p class="note">付款计划里 JPY 单据的汇率字段有的记为 0.71（每 100 日元），折算值会明显偏低，属 CRM 原始数据。</p>`;
    } catch (e) { $('#table').innerHTML = `<div class="error">${esc(e.message)}</div>`; }
  };
  $('[name=months]').addEventListener('change', load);
  load();
}

// ------------------------------------------------------------------ 页面：业务员看板（0.5）
async function pageSalesperson(view, params) {
  const people = (META.salespeople || []).filter((s) => s.part && (META.users.find((u) => u.part === s.part) || {}).active);
  const f = { who: (people[0] || {}).part || '', year: META.today.slice(0, 4), ...params };
  view.innerHTML = `<h1>业务员看板</h1>
    <div class="filters" id="filters">
      <select name="who">${options(META.users.filter((u) => u.active || u.part === f.who).map((u) => ({ part: u.part, name: u.name + ((people.find((p) => p.part === u.part) || {}).orders ? '' : '（无订单）') })), 'part', 'name', f.who, '选择业务员')}</select>
      <select name="year">${META.years.map((y) => `<option ${String(y) === String(f.year) ? 'selected' : ''}>${y}</option>`).join('')}</select>
    </div>
    <div id="body"><div class="empty">加载中…</div></div>`;
  const load = async () => {
    const q = readFilters($('#filters'));
    setHash('salesperson', q);
    const body = $('#body');
    if (!q.who) { body.innerHTML = '<div class="empty">请选择业务员</div>'; return; }
    body.classList.add('loading');
    try {
      const d = await api('/api/salesperson', q);
      const k = d.kpi, y = d.year, cut = d.cutoff.slice(5);
      const aMax = Math.max(1, ...d.monthly.map((m) => m.actions));
      body.innerHTML = `
        <div class="toolbar"><h2 style="margin:0">${esc(d.user.name)} <span class="muted small">${esc(d.user.dept || '')} ${d.user.active ? '' : '（离职）'}</span></h2>${d.rank ? `<span class="badge">${y} 年订单额排名 ${d.rank} / ${d.rank_of}</span>` : ''}<span class="spacer"></span>
          <a class="small" data-orders="1">查看订单</a> · <a class="small" data-actions="1">查看日志</a> · <a class="small" data-sales="1">销售分析</a></div>
        <div class="grid kpis dense">
          ${kpiCard(`${y} 年订单额（至 ${cut}）`, fmtWan(k.orders.amount), `${fmtInt(k.orders.count)} 单 · 同比 ${yoyText(k.orders.amount, k.orders_prev.amount)}（上年同期 ${fmtWan(k.orders_prev.amount)}）`)}
          ${kpiCard(`${y} 年回款（至 ${cut}）`, fmtWan(k.receipts.amount), `${fmtInt(k.receipts.count)} 笔 · 同比 ${yoyText(k.receipts.amount, k.receipts_prev.amount)}`)}
          ${kpiCard('执行中订单', fmtInt(k.open_orders.count), `金额 ${fmtWan(k.open_orders.amount)}`)}
          ${kpiCard('未回款计划', fmtWan(k.open_plans.amount), `${fmtInt(k.open_plans.count)} 期 · 逾期 <b class="down">${fmtWan(k.overdue_plans.amount)}</b>（${fmtInt(k.overdue_plans.count)} 期）`)}
          ${kpiCard('客户', fmtInt(k.customers_active), `${y} 年成交客户 · 名下 ${fmtInt(k.customers_owned)} 家 · 本年新客 ${fmtInt(k.customers_new)}`)}
          ${kpiCard('工作日志', fmtInt(k.actions), `${y} 年条数 · 本月 ${fmtInt(k.actions_month)} · 最近 ${esc(k.last_action || '—')}`)}
        </div>
        <div class="grid row2">
          <div class="card"><h2>${y} 年按月</h2><div class="legend"><span><i style="background:var(--s1)"></i>订单额</span><span><i style="background:var(--s2)"></i>回款额</span></div><div id="spChart"></div>
            <h3>工作日志条数</h3>${miniBars(d.monthly.map((m) => m.actions), 'act', d.monthly.map((m) => `${m.month}：${m.actions} 条`))}</div>
          <div class="card"><h2>${y} 年客户 Top 10</h2><table class="top-list"><tbody>${topRows(d.top_customers, (c) => custLink(c.customer), (c) => `${fmtInt(c.count)} 单`)}</tbody></table>
            <h3>${y} 年产品 Top 10（按型号）</h3><table class="top-list"><tbody>${topRows(d.top_products, (p) => `${prodLink(p)}<div class="muted small">${esc(p.class || '')}${p.batches > 1 ? ` · ${fmtInt(p.batches)} 个批号` : ''}</div>`, (p) => `${fmtInt(p.orders)} 单`)}</tbody></table></div>
        </div>
        <div class="grid row22" style="margin-top:14px">
          <div class="card"><h2>未回款计划 <span class="count">按计划日期 · 前 ${d.open_plans.length}</span></h2>${d.open_plans.length ? `<table><thead><tr><th>计划日期</th><th>客户</th><th>订单号</th><th class="num">金额</th><th>状态</th></tr></thead><tbody>${d.open_plans.map((p) => `<tr><td class="nowrap">${esc(p.date)}</td><td>${custLink(p.customer)}</td><td class="nowrap">${orderLink(p.order_id, p.order_no)}</td><td class="num">${fmtMoney(p.amount)}</td><td>${planTag(p)}</td></tr>`).join('')}</tbody></table>` : '<div class="muted small">无</div>'}</div>
          <div class="card"><h2>最近订单</h2>${d.recent_orders.length ? `<table><thead><tr><th>日期</th><th>客户</th><th>主题</th><th class="num">金额</th><th>状态</th></tr></thead><tbody>${d.recent_orders.map((o) => `<tr class="click" data-order="${o.id}"><td class="nowrap">${esc(o.date)}</td><td>${custLink(o.customer)}</td><td class="ellipsis" style="max-width:240px" title="${esc(o.subject)}">${esc(o.subject)}</td><td class="num">${fmtMoney(o.amount)}</td><td>${statusTag(o)}</td></tr>`).join('')}</tbody></table>` : '<div class="muted small">无</div>'}</div>
        </div>
        <div class="card" style="margin-top:14px"><h2>最近工作日志</h2>${d.recent_actions.length ? `<table><tbody>${d.recent_actions.map((a) => `<tr><td class="nowrap">${esc(a.date)}${dateFlag(a.date_flag)}</td><td class="small nowrap">${esc(a.type_text)}</td><td>${custLink(a.customer)}${a.contact ? `<div class="muted small">${esc(a.contact)}</div>` : ''}</td><td>${actionText(a)}${mentions(a)}</td></tr>`).join('')}</tbody></table>` : '<div class="muted small">无</div>'}</div>`;
      barChart($('#spChart'), { labels: d.monthly.map((m) => m.month.slice(5) + '月'), height: 220, series: [{ name: '订单额', color: 'var(--s1)', values: d.monthly.map((m) => m.orders.amount) }, { name: '回款额', color: 'var(--s2)', values: d.monthly.map((m) => m.receipts.amount) }], tipFn: (i) => `<b>${d.monthly[i].month}</b><br>订单 ${fmtMoney(d.monthly[i].orders.amount)}（${d.monthly[i].orders.count} 单）<br>回款 ${fmtMoney(d.monthly[i].receipts.amount)}（${d.monthly[i].receipts.count} 笔）<br>日志 ${d.monthly[i].actions} 条` });
      body.querySelector('a[data-orders]').addEventListener('click', () => go('orders', { who: d.user.part, from: `${y}-01-01`, to: `${y}-12-31` }));
      body.querySelector('a[data-actions]').addEventListener('click', () => go('actions', { who: d.user.part, from: `${y}-01-01`, to: `${y}-12-31` }));
      body.querySelector('a[data-sales]').addEventListener('click', () => go('sales', { by: 'customer', who: d.user.part }));
      body.querySelectorAll('tr[data-order]').forEach((tr) => tr.addEventListener('click', () => openOrder(Number(tr.dataset.order))));
      bindLinks(body);
    } catch (e) { body.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
    body.classList.remove('loading');
  };
  $('#filters').addEventListener('change', load);
  load();
}

// ------------------------------------------------------------------ 页面：联系人查询（0.5）
async function pageContacts(view, params) {
  const f = { q: '', owner: '', missing: '', sort: '', headship: '', page: 1, ...params };
  view.innerHTML = `<h1>联系人查询 <span class="muted small">跨客户按姓名 / 手机 / 微信 / 邮箱搜索；“最近联系”取挂在此联系人上的工作日志</span></h1>
    <div class="filters" id="filters">
      <input type="text" name="q" placeholder="姓名 / 手机 / 微信 / 邮箱 / 客户名称" value="${esc(f.q)}">
      <input type="text" name="headship" placeholder="职务" value="${esc(f.headship)}" style="width:110px">
      <select name="owner">${userOptions(f.owner, '全部所有者')}</select>
      <label class="small"><input type="checkbox" name="missing" ${f.missing ? 'checked' : ''}> 只看无联系方式</label>
      <select name="sort"><option value="">按客户</option><option value="last" ${f.sort === 'last' ? 'selected' : ''}>按最近联系</option><option value="actions" ${f.sort === 'actions' ? 'selected' : ''}>按日志条数</option><option value="name" ${f.sort === 'name' ? 'selected' : ''}>按姓名</option></select>
      <button class="btn primary" id="go">查询</button><button class="btn" id="reset">清空</button>${exportButton('contacts')}
    </div>
    <div class="grid row2"><div class="card"><div id="list"><div class="empty">加载中…</div></div></div><div class="card" id="side"></div></div>`;
  const load = async (page) => {
    const q = { ...readFilters($('#filters')), page };
    setHash('contacts', q);
    const list = $('#list');
    list.classList.add('loading');
    try {
      const res = await api('/api/contacts', { ...q, size: 50 });
      $('#side').innerHTML = `<div class="grid kpis dense" style="margin-bottom:10px">${kpiCard('联系人', fmtInt(res.total), '按当前筛选')}${kpiCard('无联系方式', fmtInt(res.missing), '手机 / 电话 / 微信 / QQ / 邮箱都为空')}${kpiCard('从未有日志', fmtInt(res.never_contacted), '没有挂在此人上的行动记录')}</div>
        <h3>按所有者 <span class="muted">无联系方式 / 联系人数</span></h3><table><tbody>${res.by_owner.map((o) => `<tr><td><a class="who-chip" data-part="${esc(o.part)}">${esc(o.owner || '（无）')}</a></td><td class="num">${fmtInt(o.missing)} / ${fmtInt(o.count)}</td><td style="width:40%">${inlineBar(o.missing, Math.max(1, ...res.by_owner.map((x) => x.missing)), '')}</td></tr>`).join('') || '<tr><td class="empty">无</td></tr>'}</tbody></table>
        <p class="note">工作日志正文里提到但未建档的人，见 scripts/report_missing_contacts.py 生成的专项报表。</p>`;
      $('#side').querySelectorAll('a.who-chip').forEach((a) => a.addEventListener('click', () => { $('[name=owner]').value = a.dataset.part; load(1); }));
      list.innerHTML = `<p class="summary">共 <b>${fmtInt(res.total)}</b> 人</p>
        <table><thead><tr><th>姓名</th><th>职务 / 部门</th><th>手机</th><th>电话</th><th>微信 / QQ / 邮箱</th><th>客户</th><th>所有者</th><th>最近联系</th><th class="num">日志</th></tr></thead><tbody>
        ${res.rows.map((k) => `<tr><td class="nowrap lead">${esc(k.name)}${k.missing ? ' <span class="tag bad" title="没有任何联系方式">缺</span>' : ''}</td><td class="small">${esc([k.headship, k.department].filter(Boolean).join(' / '))}</td><td class="nowrap">${esc(k.mphone || '')}</td><td class="nowrap">${esc(k.phone || '')}</td><td class="small">${esc([k.weixin, k.qq, k.email].filter(Boolean).join(' / '))}</td><td>${custLink(k.customer)}</td><td class="nowrap">${esc(k.customer.owner || '')}</td><td class="nowrap small">${esc(k.last_contact || '—')}</td><td class="num">${k.actions || ''}</td></tr>`).join('') || '<tr><td colspan="9" class="empty">没有符合条件的联系人</td></tr>'}
        </tbody></table>`;
      list.appendChild(pager(res, load));
      bindLinks(list);
    } catch (e) { list.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
    list.classList.remove('loading');
  };
  wireFilters(view, load);
  bindExport(view, () => readFilters($('#filters')));
  load(Number(f.page) || 1);
}

// ------------------------------------------------------------------ 抽屉：产品 / 采购单（0.5）
async function openProduct(key) {
  openDrawer('产品', '<div class="empty">加载中…</div>');
  try {
    key = String(key);
    const isModel = key.startsWith('model:');
    const d = await api('/api/product', isModel ? { model: key.slice(6) } : /^\d+$/.test(key) ? { id: key } : { sn: key });
    const p = d.product, ymax = Math.max(1, ...d.yearly.map((y) => y.amount));
    const head = isModel ? `
      <div class="kv">
        <div><label>型号</label><span><b>${esc(p.model_name)}</b></span></div>
        <div><label>分类</label><span>${esc(p.class)} <span class="muted small">${esc(p.group)}</span></span></div>
        <div><label>批号</label><span>${fmtInt(p.batches)} 个${p.batches_in_stock ? `，其中 ${fmtInt(p.batches_in_stock)} 个有库存` : (p.batches > 1 ? '，均无库存' : '，无库存')}${p.low_batches ? ` · <span class="tag bad">${p.low_batches} 个低于下限</span>` : ''}</span></div>
        <div><label>库存合计</label><span><b>${fmtInt(p.stock)}</b>${unitTag(p)}${p.units > 1 ? ' <span class="tag warn" title="有库存的批号之间计量单位不一致">各批号单位不一致</span>' : ''}</span></div>
        <div><label>价格</label><span class="money">${p.price ? fmtMoney(p.price) : '—'}</span></div>
        <div><label>${d.window}</label><span>销售 ${fmtMoney(p.sales_amount)} · ${fmtInt(p.sales_qty)} ${esc(p.unit || '')} · ${p.sales_orders} 单 · ${p.sales_customers} 家客户</span></div>
      </div>

      <table><thead><tr><th>编号</th><th>包装</th><th class="num">库存</th><th>状态</th><th class="num">${d.window}销售额</th><th class="num">数量</th><th class="num">单数</th><th>最近销售</th></tr></thead><tbody>

        <div><label>编号</label><span>${esc(p.sn || '（无编号）')} <span class="muted small">id ${p.id}</span></span></div>
        <div><label>分类</label><span>${esc(p.class)} <span class="muted small">${esc(p.group)}</span></span></div>
        <div><label>型号</label><span>${esc(p.model || '')} ${p.sku && p.sku !== '-' ? esc(p.sku) : ''}</span></div>
        <div><label>计量单位</label><span>${esc(p.unit || '—')}${p.unit_assumed ? ' <span class="muted small">（CRM 未填，填料按公斤）</span>' : ''}${p.pack ? ` · <label>包装</label> ${esc(p.pack)}` : ''}</span></div>

// ------------------------------------------------------------------ 抽屉：订单 / 客户详情
const drawer = $('#drawer'), overlay = $('#overlay');
const stack = [];
function openDrawer(title, html, loader) {
  stack.push({ title, html });
  $('#drawerTitle').innerHTML = title;
  $('#drawerBody').innerHTML = html;
  $('#drawerBack').style.display = stack.length > 1 ? '' : 'none';
  drawer.classList.add('show'); overlay.classList.add('show');
  if (loader) loader($('#drawerBody'));
}
function closeDrawer() { stack.length = 0; drawer.classList.remove('show'); overlay.classList.remove('show'); }
$('#drawerClose').addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);
$('#drawerBack').addEventListener('click', () => { stack.pop(); const prev = stack.pop(); if (prev) openDrawer(prev.title, prev.html, (b) => bindLinks(b)); else closeDrawer(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && drawer.classList.contains('show')) closeDrawer(); });

      <h3>订单 <span class="muted">最近 ${d.orders.length} 单</span></h3>

      ${d.open_plans.length ? `<h3>未回款计划</h3><table><thead><tr><th>计划日期</th><th>订单号</th><th class="num">金额</th><th>状态</th><th>业务员</th></tr></thead><tbody>${d.open_plans.map((p) => `<tr><td class="nowrap">${esc(p.date)}</td><td>${orderLink(p.order_id, p.order_no)}</td><td class="num">${fmtMoney(p.amount)}</td><td>${planTag(p)}</td><td>${esc(p.who)}</td></tr>`).join('')}</tbody></table>` : ''}
      <h3>回款记录 <span class="muted">最近 ${d.receipts.length} 笔</span></h3>
      ${d.receipts.length ? `<table><thead><tr><th>日期</th><th>订单号</th><th class="num">金额</th><th>付款方式</th><th>业务员</th><th>备注</th></tr></thead><tbody>${d.receipts.map((n) => `<tr><td class="nowrap">${esc(n.date)}</td><td>${orderLink(n.order_id, n.order_no)}</td><td class="num">${fmtMoney(n.amount)}</td><td class="small">${esc(n.type_text)}</td><td>${esc(n.who || '')}</td><td class="small">${esc(n.memo || '')}</td></tr>`).join('')}</tbody></table>` : '<div class="muted small">无</div>'}
      <h3>行动记录 <span class="muted">最近 ${d.actions.length} 条</span></h3>
      ${d.actions.length ? `<table><tbody>${d.actions.map((a) => `<tr><td class="nowrap">${esc(a.date)}</td><td class="nowrap">${esc(a.who.join('、'))}</td><td class="small nowrap">${esc(a.type_text)}${a.contact ? `<div class="muted">${esc(a.contact)}</div>` : ''}</td><td>${actionText(a)}${mentions(a)}</td></tr>`).join('')}</tbody></table>` : '<div class="muted small">无</div>'}
      ${d.extras.length ? `<h3>其他字段</h3><div class="kv">${d.extras.map((x) => `<div><label title="${esc(x.key)}">${esc(x.name)}</label><span>${esc(x.value)}</span></div>`).join('')}</div>` : ''}`;
    stack[stack.length - 1].title = esc(c.name);
    stack[stack.length - 1].html = html;
    $('#drawerTitle').innerHTML = esc(c.name);
    $('#drawerBody').innerHTML = html;
    $('#drawerBody').querySelectorAll('tr[data-order]').forEach((tr) => tr.addEventListener('click', () => openOrder(Number(tr.dataset.order))));
    bindLinks($('#drawerBody'));
  } catch (e) { $('#drawerBody').innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

// ------------------------------------------------------------------ 路由
const PAGES = { overview: pageOverview, orders: pageOrders, customers: pageCustomers, receivables: pageReceivables, actions: pageActions,
  sales: pageSales, 'customer-analysis': pageCustomerAnalysis, products: pageProducts, purchases: pagePurchases, salesperson: pageSalesperson, contacts: pageContacts };
let currentPage = null;
async function route() {
  const { page, params } = hashParams();
  const fn = PAGES[page] || pageOverview;
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.page === page));
  if (currentPage === page && page !== 'overview') return; // 同页内的筛选变化由页面自身处理
  currentPage = page;
  closeDrawer();
  try { await fn($('#view'), params); } catch (e) { $('#view').innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}
window.addEventListener('hashchange', () => { const { page } = hashParams(); if (page !== currentPage) route(); });
document.querySelectorAll('#nav a').forEach((a) => a.addEventListener('click', () => { currentPage = null; }));
async function loadMeta() {
  try {
    META = await api('/api/meta');
    const stale = META.synced_at && (Date.now() - new Date(META.synced_at.replace(' ', 'T')).getTime()) > 2 * 3600e3;
    const tip = esc(META.tables.map((t) => `${t.dt} ${t.total_rows} ${t.last_status || ''}`).join('\n'));
    $('#sync').innerHTML = `<span class="dot ${stale ? 'stale' : ''}"></span><span title="${tip}"><span class="wide-only">数据截至 ${esc(META.synced_at || '未同步')}${stale ? '（超过 2 小时未更新）' : ''}</span><span class="narrow-only">${esc((META.synced_at || '未同步').slice(5, 16))}${stale ? ' 待更新' : ''}</span></span>`;
  } catch (e) { $('#sync').innerHTML = `<span class="dot stale"></span><span>${esc(e.message)}</span>`; throw e; }
}
loadMeta().then(route).catch((e) => { $('#view').innerHTML = `<div class="error">无法连接前台服务：${esc(e.message)}</div>`; });
setInterval(() => loadMeta().catch(() => {}), 60000);
</script>
</body>
</html>
